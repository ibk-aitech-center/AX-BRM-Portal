# AX-BRM 비밀값 — 배포 전에 <…> 를 채운다. 채운 파일은 공유 저장소에 올리지 않는다.
#   DATABASE_URL   : create-db.sql 에서 정한 aibrm 비밀번호 + 사내 PostgreSQL 주소
#   SSO_JWT_SIGN   : AI 포탈 운영팀에서 받은 sign 문자열 (32자 이상 — 짧으면 API 가 기동을 거부한다)
#   HR_DB_PASSWORD : 인사 MariaDB 비밀번호 (인사 연동을 안 하면 "" 로 둔다)
apiVersion: v1
kind: Secret
metadata:
  name: ai-brm-secret
  labels: { app.kubernetes.io/part-of: ai-brm }
type: Opaque
stringData:
  DATABASE_URL: "postgres://aibrm:<비밀번호>@<PG host>:5432/aibrm"
  SSO_JWT_SIGN: "<AI 포탈 SSO sign, 32자 이상>"
  HR_DB_PASSWORD: ""
