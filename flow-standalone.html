<html lang="ko">
<head>

<style>
/* ── src/styles/tokens.css ── */
/* ═══════════════════════════════════════════════════════════════
   1. tokens.css — 디자인 토큰 (DESIGN_GUIDELINES §2 골격 + AX-BRM 브랜드)
   브랜드: 딥 틸 (레퍼런스 User Interviews #1c5d5f · 로드맵 --hub #0A6772 계열)
   캔버스: 따뜻한 오프화이트 종이. 파스텔 카드 2색(민트/블러시).
   컴포넌트는 팔레트를 직접 쓰지 않고 역할 토큰(--bg, --surface, --text…)만 참조한다.
   ═══════════════════════════════════════════════════════════════ */
:root {
  /* ── 브랜드 (딥 틸) ── */
  --brand-50:  #E8F3F2;
  --brand-100: #D2E7E5;
  --brand-300: #7FB7B4;
  --brand-500: #17545A;   /* 기본 강조색 — 로고 마크 원과 같은 딥 틸. 화면당 1~2회. 흰 글자 대비 7.6:1 */
  --brand-600: #12464B;   /* hover/active */
  --brand-700: #0E383C;

  /* ── 파스텔 액센트 (카드 표면 전용 — 텍스트·버튼에 쓰지 않음) ── */
  --mint:       #E4F0F1;  /* 카드 민트 */
  --mint-deep:  #65B8A2;  /* 세이지 — 장식 선·아이콘 스트로크 */
  --blush:      #F2E8E2;  /* 카드 블러시 */
  --blush-deep: #D6AEC1;  /* 더스티 로즈 — 장식 */
  --sand:       #FBF5EE;  /* 따뜻한 띠 배경 */
  --marker:     #FFE95C;  /* 형광펜 옐로 — 글자 뒤 강조 띠 전용(multiply 로 겹침) */

  /* ── 뉴트럴 (따뜻한 잉크 램프) ── */
  --ink-900: #1B2B2C;
  --ink-700: #41585E;
  --ink-500: #7A8E93;     /* 장식적 보조만 — 본문 금지(AA 미달) */
  --ink-300: #C9D6D6;
  --ink-200: #DCE6E5;     /* 헤어라인 */
  --ink-100: #EEF3F2;
  --ink-50:  #F4F8F7;     /* 페이지 캔버스 (따뜻한 오프화이트) */

  /* ── 시맨틱 (배경 + 본색 페어) ── */
  --success: #286346;  --success-bg: #DBEBE1;
  --warning: #825E10;  --warning-bg: #F4E9CF;  --warning-fill: #E9BE3A; /* 채움(점·표시)용 노랑 — 글자에는 쓰지 않는다 */
  --danger:  #A23425;  --danger-bg:  #F6E2DE;
  --info:    #384982;  --info-bg:    #DFE4F1;

  /* ── 역할 토큰 (컴포넌트는 이것만 참조) ── */
  --bg:         var(--ink-50);
  --surface:    #FFFFFF;
  --surface-2:  var(--ink-100);
  --line:       var(--ink-200);
  --line-strong: var(--ink-300);
  --text:       var(--ink-900);
  --text-sub:   var(--ink-700);
  --text-muted: #5E7379;   /* 캡션용 — 흰 배경 대비 5.0:1 (AA 통과) */
  --accent:     var(--brand-500);
  --accent-hover: var(--brand-600);
  --accent-soft: var(--brand-50);
  --on-accent:  #FFFFFF;

  /* ── 간격 (4px) ── */
  --space-xs: 4px;  --space-sm: 8px;  --space-md: 16px;
  --space-lg: 24px; --space-xl: 32px; --space-xxl: 48px; --space-3xl: 80px;

  /* ── 라운드 ── */
  --radius-sm: 10px;      /* 입력/작은 버튼 */
  --radius-md: 16px;      /* 카드 */
  --radius-lg: 24px;      /* 히어로 카드·모달 */
  --radius-full: 9999px;  /* 필 버튼·칩 */

  /* ── 그림자 — 레퍼런스 원칙 "그림자 대신 헤어라인". 모달·토스트만 예외 ── */
  --shadow-sm:       0 1px 2px rgba(27,43,44,.04);
  --shadow-card:     0 1px 3px rgba(27,43,44,.05);
  --shadow-elevated: 0 6px 20px rgba(27,43,44,.10);
  --shadow-modal:    0 20px 60px rgba(27,43,44,.28);
  /* 강조 버튼 전용 — 배경색을 띤 부드러운 그림자. 딱딱한 오프셋 선(0 2px 0)은 필 아래에 어두운 띠로 보여 쓰지 않는다 */
  --shadow-accent:       0 1px 2px rgba(14,56,60,.16), 0 4px 12px rgba(23,84,90,.14);
  --shadow-accent-hover: 0 2px 4px rgba(14,56,60,.18), 0 8px 20px rgba(23,84,90,.20);

  /* ── 모션 — 어휘 3개만: press(눌림) · pop(선택 스프링) · glide(상태 전환). 호버는 색/테두리만, 위치 이동·확대 금지 ── */
  --ease-out:    cubic-bezier(0.22, 1, 0.36, 1);
  --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);   /* pop — 선택·확정 순간에만 */
  --ease-glide:  cubic-bezier(0.16, 1, 0.3, 1);       /* glide — 진행·상태 전환 감속 */
  --ease-overshoot: cubic-bezier(0.18, 1.25, 0.4, 1); /* 토스트 등장 */
  --dur-press: 0.08s;
  --dur-pop:   0.4s;
  --transition-fast: 0.15s ease;
  --transition:      0.3s var(--ease-out);

  /* ── z-index ── */
  --z-nav: 100; --z-panel: 150; --z-modal: 200; --z-toast: 300; --z-loading: 400;

  /* ── 폰트 (전부 로컬 번들 — 폐쇄망) ── */
  --font: "Pretendard Variable", Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --font-serif: "Noto Serif KR Variable", "Noto Serif KR", "MaruBuri", "Nanum Myeongjo", serif;
  --font-mono: "D2Coding", "JetBrains Mono", Consolas, ui-monospace, monospace;

  /* ── 레이아웃 ── */
  --content-max: 1200px;
  --column-max: 880px;
  --sidebar-w: 264px;
}

/* ── src/styles/base.css ── */
/* ═══════════════════════════════════════════════════════════════
   2. base.css — 리셋 · 타이포 전역(§3) · 포커스 링 · reduced-motion 가드
   ═══════════════════════════════════════════════════════════════ */
*, *::before, *::after { box-sizing: border-box; }
* { word-break: keep-all; overflow-wrap: break-word; }
html { scrollbar-gutter: stable; -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  font-size: 15px;
  line-height: 1.6;
  letter-spacing: -0.01em;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
}
h1, h2, h3, h4 { margin: 0; line-height: 1.3; letter-spacing: -0.02em; }
h1, h2 { letter-spacing: -0.03em; text-wrap: balance; }
p { margin: 0; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
button, input, textarea, select { font: inherit; color: inherit; letter-spacing: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
button:disabled { cursor: not-allowed; opacity: .55; }
img, svg { max-width: 100%; display: block; }
ul, ol { margin: 0; padding: 0; list-style: none; }
code, kbd { font-family: var(--font-mono); font-size: .92em; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
::selection { background: var(--brand-100); }
[hidden] { display: none !important; }

.serif { font-family: var(--font-serif); font-weight: 500; letter-spacing: -0.01em; }
.num { font-variant-numeric: tabular-nums; }
.identifier { font-family: var(--font-mono); word-break: break-all; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }

/* 진입 스태거 리빌 (transform/opacity 만) */
@keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
.rise { animation: rise .5s var(--ease-out) both; }
.rise-1 { animation-delay: .05s } .rise-2 { animation-delay: .12s } .rise-3 { animation-delay: .19s } .rise-4 { animation-delay: .26s }
@keyframes shake { 10%, 90% { transform: translateX(-1px) } 20%, 80% { transform: translateX(2px) } 30%, 50%, 70% { transform: translateX(-3px) } 40%, 60% { transform: translateX(3px) } }
@keyframes spin { to { transform: rotate(360deg) } }
@keyframes pulse { 50% { opacity: .45 } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; scroll-behavior: auto !important; }
}

@media print {
  body { background: #fff; font-size: 12px; }
  .no-print { display: none !important; }
}

/* ── src/styles/components.css ── */
/* ═══════════════════════════════════════════════════════════════
   3. components.css — 버튼 · 카드 · 입력 · 뱃지 · 토스트 · 테이블 · 아코디언 (§5)
   상태는 aria/data 속성으로 스타일링한다 (§15).
   ═══════════════════════════════════════════════════════════════ */

/* ── 버튼 (필 형태 — 레퍼런스 48px 라운드) ── */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 44px; padding: 0 22px;
  border-radius: var(--radius-full);
  font-weight: 600; font-size: 15px; line-height: 1;
  border: 1.5px solid transparent;
  transition: transform var(--dur-pop) var(--ease-spring), box-shadow var(--dur-pop) var(--ease-spring), background-color var(--transition-fast), border-color var(--transition-fast), color var(--transition-fast), opacity var(--transition-fast);
  white-space: nowrap;
}
/* <a class="btn"> (router-link)도 버튼이다 — 전역 a:hover 밑줄을 끈다 */
.btn:hover, .btn:focus-visible { text-decoration: none; }
/* press: 빠르게 눌리고(.08s) 놓으면 스프링으로 복귀 */
.btn:active:not(:disabled) { transform: scale(.97); transition-duration: var(--dur-press); transition-timing-function: ease-out; }
.btn-primary { background: var(--accent); color: var(--on-accent); box-shadow: var(--shadow-accent); }
.btn-primary:hover:not(:disabled) { background: var(--accent-hover); box-shadow: var(--shadow-accent-hover); }
.btn-primary:active:not(:disabled) { box-shadow: var(--shadow-sm); }
.btn-secondary { background: var(--surface); color: var(--text); border-color: var(--line-strong); }
.btn-secondary:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
.btn-ghost { background: transparent; color: var(--text-sub); padding: 0 14px; }
.btn-ghost:hover:not(:disabled) { background: var(--surface-2); color: var(--text); }
.btn-danger { background: var(--surface); color: var(--danger); border-color: var(--danger-bg); }
.btn-danger:hover:not(:disabled) { background: var(--danger-bg); }
.btn-lg { min-height: 52px; padding: 0 30px; font-size: 16px; }
.btn-sm { min-height: 36px; padding: 0 14px; font-size: 13.5px; }
.btn-icon { width: 44px; min-width: 44px; padding: 0; border-radius: var(--radius-full); color: var(--text-sub); }
.btn-icon:hover:not(:disabled) { background: var(--surface-2); color: var(--text); }
.btn-icon.btn-sm { width: 36px; min-width: 36px; }
/* 드러나는 아이콘 버튼 — 올리면 라벨 칸(grid 0fr→1fr)이 옆으로 열리며 의도색으로 물든다 (RevealButton) */
.btn-reveal { position: relative; min-width: 36px; padding: 0 9px; gap: 0; color: var(--text-sub); background: transparent; border-color: transparent;
  transition: background-color .22s ease, color .22s ease, border-color .22s ease, padding .28s var(--ease-out), transform var(--dur-pop) var(--ease-spring); }
.btn-reveal-ico { display: inline-flex; width: 16px; justify-content: center; font-size: 15px; line-height: 1; }
.btn-reveal-lbl { display: grid; grid-template-columns: 0fr; opacity: 0; transition: grid-template-columns .28s var(--ease-out), opacity .18s ease; }
.btn-reveal-lbl > span { overflow: hidden; white-space: nowrap; padding-left: 0; transition: padding-left .28s var(--ease-out); }
.btn-reveal:hover:not(:disabled), .btn-reveal:focus-visible { padding: 0 12px 0 10px; }
.btn-reveal:hover:not(:disabled) .btn-reveal-lbl, .btn-reveal:focus-visible .btn-reveal-lbl { grid-template-columns: 1fr; opacity: 1; transition-delay: 0s, .06s; }
.btn-reveal:hover:not(:disabled) .btn-reveal-lbl > span, .btn-reveal:focus-visible .btn-reveal-lbl > span { padding-left: 6px; }
.btn-reveal[data-tone="neutral"]:hover:not(:disabled), .btn-reveal[data-tone="neutral"]:focus-visible { background: var(--surface); border-color: var(--line-strong); color: var(--text); }
.btn-reveal[data-tone="brand"]:hover:not(:disabled), .btn-reveal[data-tone="brand"]:focus-visible { background: var(--brand-50); color: var(--brand-600); }
.btn-reveal[data-tone="danger"]:hover:not(:disabled), .btn-reveal[data-tone="danger"]:focus-visible { background: var(--danger-bg); color: var(--danger); }
/* 터치(hover 없음)에서는 늘어나지 않고 아이콘만 — 이름은 aria-label 이 맡는다 */
@media (hover: none) { .btn-reveal:hover:not(:focus-visible) { padding: 0 9px; } .btn-reveal:hover:not(:focus-visible) .btn-reveal-lbl { grid-template-columns: 0fr; opacity: 0; } }

/* ── 카드 ── */
.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius-md);
  padding: var(--space-lg);
}
.card-mint { background: var(--mint); border-color: transparent; }
.card-blush { background: var(--blush); border-color: transparent; }
.card-soft { background: var(--surface-2); border-color: transparent; }
.card-title { font-size: 16px; font-weight: 600; margin-bottom: var(--space-sm); }
.card-hover { transition: transform var(--transition), border-color var(--transition); }
.card-hover:hover { transform: translateY(-2px); border-color: var(--brand-300); }

/* ── 눈썹 라벨 (섹션 소제목 — 모노 대문자, 점 프리픽스) ── */
.eyebrow {
  display: inline-flex; align-items: center; gap: 8px;
  font-family: var(--font-mono); font-size: 12px; letter-spacing: .03em; text-transform: uppercase;
  color: var(--text-muted);
}
/* 한글은 자간을 넓히면 "어 떤 일" 처럼 벌어져 보인다 — 영문 대문자 기준(.08em)이 아닌 .03em 을 쓴다 */
.eyebrow::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--mint-deep); }

/* ── 입력 ── */
.field { display: flex; flex-direction: column; gap: 6px; }
.label { font-size: 13.5px; font-weight: 600; color: var(--text-sub); }
.input, .textarea, .select {
  width: 100%; background: var(--surface); color: var(--text);
  border: 1.5px solid var(--line-strong); border-radius: var(--radius-sm);
  padding: 12px 14px; font-size: 15px; line-height: 1.5;
  transition: border-color var(--transition-fast), box-shadow var(--transition-fast);
}
.input { min-height: 48px; }
.textarea { min-height: 120px; resize: vertical; }
.input:focus, .textarea:focus, .select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(28,93,95,.16); }
.input[aria-invalid="true"], .textarea[aria-invalid="true"] { border-color: var(--danger); animation: shake .4s; }
.input::placeholder, .textarea::placeholder { color: var(--ink-500); }
.hint { font-size: 13px; color: var(--text-muted); }
.error-text { font-size: 13px; color: var(--danger); }

/* ── 선택 카드 (radio-as-card) ── */
.choice {
  display: flex; gap: 14px; align-items: flex-start; width: 100%; text-align: left;
  background: var(--surface); border: 1.5px solid var(--line-strong); border-radius: var(--radius-md);
  padding: 16px 18px; min-height: 56px;
  transition: border-color var(--transition-fast), background-color var(--transition-fast), transform var(--transition-fast);
}
.choice:hover { border-color: var(--brand-300); background: var(--accent-soft); }
.choice[aria-checked="true"] { border-color: var(--accent); background: var(--accent-soft); animation: pop-choice var(--dur-pop) var(--ease-out); }
@keyframes pop-choice { 0% { transform: scale(1); } 35% { transform: scale(1.02); } 100% { transform: scale(1); } }
.choice-mark {
  flex: 0 0 22px; width: 22px; height: 22px; margin-top: 1px; border-radius: 50%;
  border: 2px solid var(--line-strong); display: grid; place-items: center; transition: border-color var(--transition-fast), background-color var(--transition-fast);
}
.choice[aria-checked="true"] .choice-mark { border-color: var(--accent); background: var(--accent); }
.choice-mark::after { content: ''; width: 8px; height: 8px; border-radius: 50%; background: #fff; opacity: 0; transform: scale(0); transition: transform var(--dur-pop) var(--ease-spring), opacity var(--transition-fast); }
.choice[aria-checked="true"] .choice-mark::after { opacity: 1; transform: scale(1); }
.choice-label { display: block; font-weight: 600; font-size: 15px; line-height: 1.45; }
.choice-hint { display: block; font-size: 13px; color: var(--text-muted); margin-top: 3px; line-height: 1.5; }
.choice-unknown { border-style: dashed; }

/* ── 뱃지 (색 + 텍스트 3중 부호화는 사용처에서 이모지 추가) ── */
.badge {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 3px 10px; border-radius: var(--radius-full);
  font-size: 12.5px; font-weight: 700; line-height: 1.4; white-space: nowrap;
  background: var(--surface-2); color: var(--text-sub);
}
.badge[data-tone="info"] { background: var(--info-bg); color: var(--info); }
.badge[data-tone="success"] { background: var(--success-bg); color: var(--success); }
.badge[data-tone="warning"] { background: var(--warning-bg); color: var(--warning); }
.badge[data-tone="danger"] { background: var(--danger-bg); color: var(--danger); }
.badge[data-tone="brand"] { background: var(--brand-100); color: var(--brand-700); }
.badge[data-tone="neutral"] { background: var(--surface-2); color: var(--text-sub); }

/* ── 칩 ── */
.chip {
  display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 0 14px;
  border-radius: var(--radius-full); border: 1.5px solid var(--line-strong); background: var(--surface);
  font-size: 13.5px; font-weight: 500; color: var(--text-sub);
  transition: background-color var(--transition-fast), border-color var(--transition-fast), color var(--transition-fast);
}
.chip:hover { border-color: var(--accent); color: var(--accent); }
.chip[aria-pressed="true"] { background: var(--text); border-color: var(--text); color: #fff; animation: pop-chip var(--dur-pop) var(--ease-spring); }
@keyframes pop-chip { from { transform: scale(.94); } to { transform: scale(1); } }

/* ── 세그먼트 컨트롤 — "여러 값 중 하나" 자리의 공용 모션 (SegControl.vue)
   잉크 필이 고른 항목으로 늘어났다 줄어들며 미끄러진다(stretch → settle). 칩(chip)은 다중 선택·토글 전용으로 남긴다. ── */
/* 세로 flex(.field) 안에서는 내용 폭만큼만(align-self) — 한 줄에 다 못 들어가 줄이 바뀌면 항목이 늘어나 각 줄을 채운다 */
.seg { position: relative; display: inline-flex; flex-wrap: wrap; gap: 4px; padding: 4px; border-radius: var(--radius-full); background: var(--surface-2); max-width: 100%; align-self: flex-start; }
.seg-thumb { position: absolute; left: 0; top: 0; border-radius: var(--radius-full); background: var(--text); box-shadow: 0 1px 2px rgba(27,43,44,.18); opacity: 0; pointer-events: none; will-change: left, width; }
.seg-item {

/* ── 패널 교체(swap) — 세그먼트로 내용이 바뀔 때: 뒤로 물러나며 흐려졌다가(blur) 새 내용이 앞으로 또렷해진다 ── */
.swap-enter-active { transition: opacity .28s var(--ease-glide), transform .36s var(--ease-glide), filter .28s ease; }
.swap-leave-active { transition: opacity .16s ease, transform .16s ease, filter .16s ease; }
.swap-enter-from { opacity: 0; transform: translateY(8px) scale(.985); filter: blur(4px); }
.swap-leave-to { opacity: 0; transform: translateY(-6px) scale(.99); filter: blur(3px); }

/* ── 토스트 ── */
.toast-stack { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); display: flex; flex-direction: column; gap: 8px; z-index: var(--z-toast); width: min(480px, calc(100vw - 32px)); }

.toast[data-tone="warning"] { border-left-color: #F0C86A; }
.toast-action { margin-left: auto; color: #fff; font-weight: 700; text-decoration: underline; }

/* ── 테이블 ── */
.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius-md); background: var(--surface); }

.qrow {
  display: grid; grid-template-columns: 1fr auto auto; gap: 12px; align-items: center;

/* ── 진행바 ── */
.progress { height: 6px; background: var(--line); border-radius: var(--radius-full); overflow: hidden; }
.progress > span { display: block; height: 100%; background: var(--accent); border-radius: inherit; transition: transform .6s var(--ease-glide); transform-origin: left; }

/* ── 스피너 ── */
/* ── 제출 상태 버튼 (SubmitButton.vue): idle → loading(점 3개) → done(체크 드로우) ── */
.btn-state { position: relative; }
.btn-state .bs-label { display: inline-flex; align-items: center; gap: 8px; transition: opacity .2s ease, transform .25s var(--ease-glide); }
.btn-state .bs-dots, .btn-state .bs-check { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; gap: 6px; opacity: 0; transition: opacity .2s ease; pointer-events: none; }
.btn-state[data-state="loading"] .bs-label, .btn-state[data-state="done"] .bs-label { opacity: 0; transform: translateY(-8px); }
.btn-state[data-state="loading"] .bs-dots, .btn-state[data-state="done"] .bs-check { opacity: 1; }
.btn-state:disabled { opacity: 1; }
.btn-state[data-state="idle"]:disabled { opacity: .55; }
.bs-dots i { width: 7px; height: 7px; border-radius: 50%; background: currentColor; animation: bs-bounce .6s ease-in-out infinite; }
.bs-dots i:nth-child(2) { animation-delay: .12s; } .bs-dots i:nth-child(3) { animation-delay: .24s; }

.bs-check { width: 24px; height: 24px; margin: auto; }

.btn-state[data-state="done"] .bs-check path { animation: bs-draw .4s var(--ease-glide) .05s forwards; }

.spinner { width: 20px; height: 20px; border: 2.5px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; }

/* ── 모달 ── */
.modal-backdrop { position: fixed; inset: 0; background: rgba(27,43,44,.45); display: grid; place-items: center; z-index: var(--z-modal); padding: 16px; }

/* ── 타임라인 ── */

.tl-item { display: grid; grid-template-columns: 18px 1fr; gap: 12px; }

/** @param {string} id */
function getQuestion(id) {
  return QUESTIONS.find((q) => q.id === id);
}

/**
 * 현재 답변 기준으로 노출되는 질문 목록 (순서 유지)
 * @param {Record<string,string>} answers
 */
function visibleQuestions(answers) {
  return QUESTIONS.filter((q) => !q.showIf || q.showIf(answers));
}

/**
 * 답변이 유효한지 (optional 은 빈 값 허용)
 * @param {Question} q
 * @param {string|undefined} v
 */
function isAnswered(q, v) {
  if (q.optional) return v !== undefined; // 빈 문자열도 "건너뜀"으로 답한 것
  return typeof v === 'string' && v.trim().length > 0;
}

/**
 * 다음에 답해야 할 질문 (없으면 null = 전부 완료)
 * @param {Record<string,string>} answers
 */
function nextQuestion(answers) {
  for (const q of visibleQuestions(answers)) {
    if (!isAnswered(q, answers[q.id])) return q;
  }
  return null;
}

/** 보기에서 빠졌지만 예전 요청에 저장돼 있을 수 있는 값 — 값 그대로가 아니라 당시 라벨로 보여준다 */
const LEGACY_OPTION_LABELS = /** @type {Record<string, Record<string, string>>} */ ({
  q19_manager: { aware: '알고는 계세요' }, // 2026-09-04 보기 제거
});
/**
 * 답변을 사람이 읽는 형태로 (완료 행 요약·요약 화면·BRM 검토용)
 * @param {Question} q
 * @param {string|undefined} v
 */
function formatAnswer(q, v) {
  if (v === undefined || v === '') return q.optional ? '건너뜀' : '–';
  if (q.type === 'single') {
    const o = q.options?.find((x) => x.value === v);
    return o ? o.label : LEGACY_OPTION_LABELS[q.id]?.[v] ?? v;
  }
  return v;
}

/**
 * 노출되지 않는 질문의 답은 제거 (분기가 바뀐 뒤 잔존 답변 정리)
 * @param {Record<string,string>} answers
 */
function pruneAnswers(answers) {
  const visible = new Set(visibleQuestions(answers).map((q) => q.id));
  /** @type {Record<string,string>} */
  const out = {};
  for (const [k, v] of Object.entries(answers)) if (visible.has(k)) out[k] = v;
  return out;
}

/**
 * @param {Record<string,string>} a
 * @param {string} version
 * @returns {Judgement}
 */
function judge(a, version) {
  /** @type {Judgement['flags']} */
  const flags = [];
  const unknowns = Object.entries(a).filter(([, v]) => v === 'unknown' || v === 'tbd' || v === 'consult').map(([k]) => k);

  const channel = a.q2_channel || 'ch1';
  /** @type {Track} */
  const track = a.q7_kind === 'geni' || a.q7_kind === 'rpa' || a.q7_kind === 'dev' ? a.q7_kind : 'consult';
  const dev = track === 'dev' || track === 'rpa' || track === 'consult';

  /** @type {Judgement['stakeholders']} */
  const stakeholders = [];
  /** @type {string[]} */
  const prep = [];
  stakeholders.push(STAKEHOLDERS.dept, STAKEHOLDERS.hub, STAKEHOLDERS.governance); // AX-BRM 은 모든 갈래에서 현업 다음 순서 · AI 거버넌스는 모든 시나리오 공통

  // 공통 준비물
  prep.push('지금 일하는 순서를 보여줄 화면 캡처나 엑셀 양식 (있는 그대로)');
  if (a.q19_manager === 'no') prep.push('부서장 보고 (진행 확정 전까지 · 결재 아님)');

  // ── 기성복 갈래: 짧게 끝
  if (!dev) {
    return {
      version, channel, track, dataCase: null, pii: null, integration: null, embed: false,
      leadtime: { min: 1, max: 2, items: [{ label: 'Geni 특화서비스 활용 안내·코칭', min: 1, max: 2 }], prep: null, calc: null },
      stakeholders, prep,
      flags: [{ level: 'info', text: '이미 있는 Geni 특화서비스로 해결될 수 있는지 AX-BRM이 먼저 확인하고, 부족하면 다른 개발 방법을 협의드려요.' }],
      unknowns,
    };
  }

  // ── 데이터 케이스
  /** @type {DataCase} */
  let dataCase = null;
  /** @type {Judgement['pii']} */
  let pii = null;
  /** @type {Integration} */
  let integration = null;

  if (a.q9_data === 'no') {
    dataCase = 'A';
    integration = 'none';
  } else {
    if (a.q9_data === 'unknown') flags.push({ level: 'check', text: '행내 데이터가 필요한지 확실하지 않아요. 일단 "모양만 같으면 되는" 표준 경로로 가정했어요.' });
    if (a.q10_realvalue === 'real') {
      dataCase = 'C';
      flags.push({ level: 'warn', text: '실제 값이 필요하면 데이터 반출 심사(+3~5주)가 추가되고 승인 여부가 불확실해요. AX-BRM이 "모양만 같아도 되는지"를 먼저 함께 확인해드릴게요.' });
      prep.push('실제 값이 꼭 필요한 이유와 필요한 범위(항목·기간) 메모');
    } else {
      dataCase = 'B';
      if (a.q10_realvalue === 'unknown') flags.push({ level: 'check', text: '실제 값이 필요한지는 검토 때 함께 확인해요. 표준 경로(모양만)로 가정했어요.' });
    }
    pii = a.q11_pii === 'yes' ? 'yes' : a.q11_pii === 'no' ? 'no' : 'unknown';
    if (pii === 'yes') {
      flags.push({ level: 'warn', text: '개인정보가 포함되면 어떤 경로든 가명처리와 이용 근거 심의(+2~4주)가 필요해요.' });
    } else if (pii === 'unknown') {
      flags.push({ level: 'check', text: '개인정보 포함 여부는 검토 때 함께 확인해요.' });
    }
    prep.push('필요한 데이터 항목 목록과 항목별 쓰는 이유 — 엑셀 맨 윗줄 제목 수준이면 충분');
    stakeholders.push(STAKEHOLDERS.data);

    // 연계 방식
    if (a.q13_online === 'online') {
      integration = 'mart';
      flags.push({ level: 'info', text: '실시간 조회는 마트(정리된 데이터 창고)에 필요한 항목이 있는지 먼저 확인해요. 없으면 개발부터 연계까지 기간(8주+)이 추가로 필요해요.' });
      prep.push('필요한 항목이 정보계·마트에 이미 있는지 데이터 담당자에게 한 번 확인');
    } else if (a.q13_online === 'batch' || a.q13_online === 'once') {
      // once(한 번만) 는 정기 갱신과 같은 갈래(시나리오 4). 대용량이면 일괄 적재(bulk), 계속 갱신이면 BDP.
      // q15_recurring 은 q13_online 에 통합되기 전(2026-09-07 이전) 저장된 답변과의 호환용
      const once = a.q13_online === 'once' || a.q15_recurring === 'once';
      if (a.q14_volume === 'small') integration = 'file';
      else if (a.q14_volume === 'large' || a.q14_volume === 'huge') integration = once ? 'bulk' : 'bdp';
      else integration = 'tbd';
    } else {
      integration = 'tbd';
    }
  }

  // ── 배포 관련 답변은 판정하지 않는다 — 배포 방식은 개발 협의를 거친 뒤 정해진다.
  //    다만 "기존 시스템 안에서 동작" 을 명확히 고른 경우는 embed=true 로 남겨 판정 패널이 협의 필수 카드를 따로 띄운다.
  const embed = a.q16_embed === 'embed';
  if (a.q16_embed === 'unknown') {
    flags.push({ level: 'check', text: '기존 시스템 결합 여부는 협의 때 함께 확인해요.' });
  }
  stakeholders.push(STAKEHOLDERS.security);
  if (pii === 'yes') stakeholders.push(STAKEHOLDERS.privacy); // 개인정보 검토는 맨 뒤에 표시

  // ── 리드타임 초안 — **요건 확정 후** 개발 착수부터 오픈까지만 합산한다.
  //    요청서 작성·요건 구체화·AX-BRM 협의 구간(prepPhase)은 요청자에게 전체가 길어 보여서 합산에서 빼고, BRM 내부 참고로만 남긴다 (2026-09-08).
  /** @type {LeadItem[]} */
  const items = [];
  /** @type {LeadItem} */
  let prepPhase;
  if (!integration || integration === 'none') {
    // 데이터가 필요 없으면 협의·연계가 없어 전 구간이 가볍다
    prepPhase = { label: '원하는 일 정리 · AX-BRM 상담', min: 1, max: 1 };
    const devA = a.q20_participate === 'yes' ? [1, 2] : [2, 3];
    items.push({ label: 'AI와 함께 초안 만들기', min: devA[0], max: devA[1], dev: true });
    items.push({ label: '반입 점검 · 오픈', min: 1, max: 2 });
  } else {
    prepPhase = { label: '원하는 일 정리 · AX-BRM 상담', min: 2, max: 3 };
    if (dataCase === 'C') items.push({ label: '실제 데이터를 밖에서 써도 되는지 심사', min: 3, max: 5 });
    const devW = a.q20_participate === 'yes' ? [4, 6] : [6, 8];
    items.push({ label: 'AI와 함께 초안 만들기', min: devW[0], max: devW[1], dev: true });
    // 병행 묶음(만들기와 동시에 진행): 개인정보 심의 → 데이터 연결 순서로 **이어서** 진행된다고 본다 (심의를 통과해야 데이터를 받을 수 있다 — 2026-09-08 확정).
    //   그래서 병행 묶음끼리는 더하고, 그 합이 만들기보다 길면 넘치는 만큼만 전체에 더한다. 화면도 이 순서대로 보여 준다.
    if (pii === 'yes') items.push({ label: '개인정보 가명처리 · 이용 근거 심의', min: 2, max: 4, parallel: true });
    const w = INTEGRATION_LABEL[integration].weeks;
    items.push({ label: `데이터 연결 — ${INTEGRATION_LABEL[integration].plain}`, min: w[0], max: w[1], parallel: true });
    items.push({ label: '반입 점검 · 통합 검증 · 오픈', min: 2, max: 3 });
  }
  const serial = items.filter((i) => !i.parallel);
  const par = items.filter((i) => i.parallel);
  let min = serial.reduce((sum, i) => sum + i.min, 0);
  let max = serial.reduce((sum, i) => sum + i.max, 0);
  /** @type {LeadCalc | null} 합산 근거 — 화면이 "어떻게 더했는지"를 그대로 보여 준다 */
  let calc = null;
  if (par.length) {
    const pMin = par.reduce((sum, i) => sum + i.min, 0);
    const pMax = par.reduce((sum, i) => sum + i.max, 0);
    const devItem = items.find((i) => i.dev);
    const dMin = devItem ? devItem.min : 0, dMax = devItem ? devItem.max : 0;
    const extra = { min: Math.max(0, pMin - dMin), max: Math.max(0, pMax - dMax) };
    calc = { serial: { min, max }, parallel: { min: pMin, max: pMax }, dev: { min: dMin, max: dMax }, extra };
    min += extra.min;
    max += extra.max;
  }
  // 어떤 도움이 맞는지도 모르거나(상담 필요), 데이터가 필요한지부터 모르는데 그 뒤 답도 전부 모르겠다면 숫자를 앞세우지 않는다.
  // 요청자 화면은 "협의 후 정해요"로 보여 주고, 세부 항목은 BRM 이 참고할 초안으로만 남긴다 (2026-09-08).
  const tbd = track === 'consult' || (a.q9_data === 'unknown' && integration === 'tbd');
  /** @type {{min:number,max:number,items:LeadItem[],prep:LeadItem,calc:LeadCalc|null,tbd?:boolean}|null} */
  const leadtime = tbd ? { min, max, items, prep: prepPhase, calc, tbd: true } : { min, max, items, prep: prepPhase, calc };

  if (a.q20_participate === 'no') prep.push('참여 시간이 어려울 때의 대안(참여 범위·지원 방식)을 협의 때 상의');
  if (track === 'consult') flags.unshift({ level: 'info', text: '어떤 도움이 맞는지 아직 정해지지 않았어요. 아래 판정은 "새로 만드는 경우"를 가정한 초안이고, 진행 방식과 기간은 AX-BRM이 상담 후 함께 정해요.' });

  return { version, channel, track, dataCase, pii, integration, embed, leadtime, stakeholders, prep, flags, unknowns };
}

/** 리드타임 범위를 사람이 읽는 문장으로 — "요건 확정 후 개발" 기간이라는 맥락은 부르는 쪽의 라벨(LEADTIME_LABEL)이 붙인다 */
function leadtimeText(/** @type {Judgement['leadtime']} */ lt) {
  if (!lt) return '검토 후 안내';
  if (lt.tbd) return 'AX-BRM과 협의 후 정해요';
  if (lt.min === lt.max) return `약 ${lt.min}주`;
  return `약 ${lt.min}~${lt.max}주`;
}

/**
 * 예상 기간 표기 문구 — 어디서 보여 주든 "요건 확정 후 · 참고용 · 달라질 수 있음" 이 함께 읽히도록 한 곳에서만 관리한다.
 * short: 표·카드의 짧은 라벨 / title: 판정 카드 제목 / sub: 제목 아래 한 줄 / note: 세부 항목 아래 안내
 */
const LEADTIME_LABEL = {
  dev: {
    short: '개발 예상 기간',
    title: '요건 확정 후 개발 예상 기간',
    sub: '원하는 일이 정리되고 AX-BRM 상담이 끝난 뒤, 개발 착수부터 오픈까지 걸릴 것으로 예상하는 참고 기간이에요. 만들 내용과 개발 난이도에 따라 달라질 수 있어요.',
    note: '요청서 작성과 원하는 일을 정리하는 기간은 포함하지 않았어요. 확정 기간이 아니라 참고용 초안이고, AX-BRM 검토 후 다시 안내해요.',
  },
  geni: {
    short: '안내 예상 기간',
    title: '안내·코칭 예상 기간',
    sub: 'AX-BRM이 이미 있는 Geni 특화서비스 활용을 안내·코칭하는 데 걸릴 것으로 예상하는 참고 기간이에요. 상황에 따라 달라질 수 있어요.',
    note: '확정 기간이 아니라 참고용 초안이고, AX-BRM 검토 후 다시 안내해요.',
  },
};
/** 주 범위 표기 — 같으면 "4주", 다르면 "4~6주" */
const weeksText = (/** @type {{min:number,max:number}} */ r) => (r.min === r.max ? `${r.min}주` : `${r.min}~${r.max}주`);

/**
 * "어떻게 더했는지" 한 문장 — 항목을 그냥 더한 값과 합계가 달라 생기는 혼동을 막는다.
 *   병행 묶음(개인정보 심의 → 데이터 연결)은 만들기와 동시에 진행되므로, 묶음 합이 만들기보다 긴 만큼만 더한다.
 * @returns {{ formula: string, note: string } | null} formula = 숫자 식, note = 말로 푼 설명. 병행 항목이 없으면 null
 */
function leadtimeCalcText(/** @type {Judgement['leadtime']} */ lt) {
  const c = lt?.calc; if (!c) return null;
  const over = c.extra.max > 0;
  const formula = over
    ? `차례로 진행 ${weeksText(c.serial)} + 동시 진행에서 넘치는 ${weeksText(c.extra)} = 약 ${weeksText({ min: lt.min, max: lt.max })}`
    : `차례로 진행 ${weeksText(c.serial)} = 약 ${weeksText({ min: lt.min, max: lt.max })}`;
  const note = over
    ? `연한 점 항목은 만들기(${weeksText(c.dev)})와 동시에 진행돼요. 이어서 하면 ${weeksText(c.parallel)}가 걸려 만들기보다 ${weeksText(c.extra)} 더 걸리므로, 그만큼만 더했어요. 항목을 모두 더한 값보다 짧은 이유예요.`
    : `연한 점 항목은 만들기(${weeksText(c.dev)})와 동시에 진행돼요. ${weeksText(c.parallel)}면 끝나 만들기 기간 안에 들어가므로 따로 더하지 않았어요.`;
  return { formula, note };
}

/** 숫자 바로 아래 붙는 경고 한 줄 — "확정 기간으로 읽지 말 것" (2026-09-09: 예상치임을 더 분명히) */
const LEADTIME_CAVEAT = '확정된 기간이 아니에요. 검토와 협의를 거치며 달라질 수 있어요.';

/** 판정의 갈래에 맞는 예상 기간 문구 */
function leadtimeLabel(/** @type {Partial<Judgement> | null | undefined} */ j) {
  return j?.track === 'geni' ? LEADTIME_LABEL.geni : LEADTIME_LABEL.dev;
}

/**

 *  - 앱: src/flow-main.ts 가 import 해서 mountFlow() 호출
 *  - standalone: server/scripts/gen-flow-standalone.js 가 이 파일과 shared/*.js 원문을 한 HTML 로 인라인
 * 규칙: import 문은 한 줄로 유지할 것(standalone 생성기가 줄 단위로 제거한다). CSS/폰트 import 금지.
 *
 * 구성: ① 시나리오별 질문 흐름(흐름을 가르는 답 3개 기준으로 4개 단락) ② 시나리오 시뮬레이터
 */



/** @typedef {(typeof QUESTIONS)[number]} Q */
/** @typedef {Record<string, string>} Ctx */

const D = /** @type {Record<string, {label:string,plain:string}>} */ (DATACASE_LABEL);
const I = /** @type {Record<string, {label:string,plain:string}>} */ (INTEGRATION_LABEL);
const SEC = Object.fromEntries(SECTIONS.map((s) => [s.key, s.title]));
const QNO = new Map(QUESTIONS.map((q, i) => [q.id, i + 1]));
const esc = (/** @type {string} */ s) => s.replace(/&/g, '&amp;').replace(/</g, '&lt;');

function fillAnswer(/** @type {Q} */ q) {
  if (q.type === 'single') return q.options ? q.options[0].value : '';
  return q.optional ? '' : '(예시 답변)';
}

/** partial 로 지정한 답 + 나머지는 기본값으로 끝까지 채운 완성 시나리오 */
function complete(/** @type {Ctx} */ partial) {
  /** @type {Ctx} */
  const a = {};
  for (let i = 0; i < 60; i++) {
    const q = nextQuestion(a);
    if (!q) break;
    a[q.id] = partial[q.id] !== undefined ? partial[q.id] : fillAnswer(q);
  }
  return pruneAnswers(a);
}

/* ── ① 시나리오별 질문 흐름 ──────────────────────────────────────
 * 질문 노출을 가르는 답은 3개뿐이다: q7(원하는 결과) · q9(데이터 필요) · q13(실시간성).
 * 그 조합으로 서로 다른 질문 흐름 4가지가 나온다. */
function routeClass(/** @type {string} */ id, /** @type {string} */ v) {
  if (id === 'q7_kind') return v === 'geni' ? 'util' : 'dev';
  if (id === 'q9_data') return v === 'no' ? 'no' : 'yes';
  if (id === 'q13_online') return v === 'online' ? 'on' : 'off';
  return '';
}

const SCENARIOS = [
  { key: 's1', emoji: '👕', num: 1, title: '기성복 — 행내 AI 도구로 해결', cond: '원하는 결과 = 글 요약·초안·문서에서 답 찾기 (GENI)', tone: 'mint', route: /** @type {Ctx} */ ({ q7_kind: 'geni' }) },
  { key: 's2', emoji: '🧮', num: 2, title: '맞춤복 — 데이터가 필요 없는 프로그램', cond: '새 프로그램 + 행내 데이터 불필요 (계산기형)', tone: '', route: /** @type {Ctx} */ ({ q7_kind: 'dev', q9_data: 'no' }) },
  { key: 's3', emoji: '🏪', num: 3, title: '맞춤복 — 데이터 필요 · 실시간 조회', cond: '새 프로그램 + 데이터 필요 + 실시간성 필요', tone: '', route: /** @type {Ctx} */ ({ q7_kind: 'dev', q9_data: 'yes', q13_online: 'online' }) },
  { key: 's4', emoji: '🚰', num: 4, title: '맞춤복 — 데이터 필요 · 정기 갱신', cond: '새 프로그램 + 데이터 필요 + 정기 갱신이나 한 번만 받으면 충분', tone: 'blush', route: /** @type {Ctx} */ ({ q7_kind: 'dev', q9_data: 'yes', q13_online: 'batch' }) },
];

/** 분기 질문에서 "다른 답"을 고르면 어느 시나리오로 가는지 */
const ALT = /** @type {Record<string, Record<string, { to: string, label: string }>>} */ ({
  q7_kind: { geni: { to: 's1', label: '시나리오 1' }, rpa: { to: 's2', label: '시나리오 2~4' }, dev: { to: 's2', label: '시나리오 2~4' }, consult: { to: 's2', label: '시나리오 2~4' } },
  q9_data: { no: { to: 's2', label: '시나리오 2' }, yes: { to: 's3', label: '시나리오 3~4' }, unknown: { to: 's3', label: '시나리오 3~4' } },
  q13_online: { online: { to: 's3', label: '시나리오 3' }, batch: { to: 's4', label: '시나리오 4' }, once: { to: 's4', label: '시나리오 4' }, unknown: { to: 's4', label: '시나리오 4' } },
});

function renderScenarioQuestion(/** @type {Q} */ q, /** @type {number} */ localNo, /** @type {(typeof SCENARIOS)[number]} */ sc) {
  const isGate = q.id in ALT;
  /** @type {string} */
  let opts;
  if (q.type === 'single' && q.options) {
    opts = q.options.map((o) => {
      if (isGate) {
        const mine = sc.route[q.id] !== undefined && routeClass(q.id, o.value) === routeClass(q.id, sc.route[q.id]);
        if (mine) return `<li class="fopt fopt-sel">✓ ${esc(o.label)}</li>`;
        const alt = ALT[q.id][o.value];
        return `<li class="fopt fopt-alt"><a href="#sc-${alt.to}">${esc(o.label)} → ${alt.label}</a></li>`;
      }
      return `<li class="fopt${o.unknown ? ' fopt-unknown' : ''}">${esc(o.label)}</li>`;
    }).join('');
  } else {
    opts = `<li class="fopt fopt-text">${q.optional ? '주관식 (선택 — 건너뛰기 가능)' : '주관식'}</li>`;
  }
  return `<div class="fnode${isGate ? ' fnode-gate' : ''}">
    <div class="fask"><span class="fno num">${localNo}</span><span class="fno num fno-global">Q${QNO.get(q.id)}</span><span class="fsec">${esc(SEC[q.section] || '')}</span> <b>${esc(q.ask)}</b>${isGate ? '<span class="fgate">🔀 흐름 분기</span>' : ''}</div>
    <ul class="fopts">${opts}</ul>
  </div>`;
}

function renderScenarioJudgement(/** @type {Ctx} */ a) {
  const j = judge(a, QUESTIONNAIRE_VERSION);

  /** @type {string[]} */

    rows.push(`<div class="jrow"><span class="jname">${name}</span><span class="jplain">${esc(plain)}</span>${internal ? `<span class="jint">${esc(internal)}</span>` : ''}</div>`);
  row('도움 방식', t.plain, t.label);

    <p class="notice" data-level="warn" style="margin-top:10px"><span class="notice-emoji">🛡️</span><span><b>꼭 확인하세요</b><br>${GOVERNANCE_NOTICES.map((n) => '– ' + n).join('<br>')}</span></p>`;

/* ── ② 시나리오 시뮬레이터 ───────────────────────────────────── */
/** @type {Ctx} */

function renderJudgement(/** @type {Ctx} */ a) {
  if (!a.q7_kind) return `<p class="hint">원하는 결과(도움 방식)까지 답하면 판정이 나타나요.</p>`;
  const j = judge(a, QUESTIONNAIRE_VERSION);
  const t = TRACK_LABEL[j.track];
  /** @type {string[]} */
  const rows = [];
  const row = (/** @type {string} */ name, /** @type {string} */ plain, /** @type {string} */ internal) =>
    rows.push(`<div class="jrow"><span class="jname">${name}</span><span class="jplain">${esc(plain)}</span><span class="jint">${esc(internal)}</span></div>`);
  row('도움 방식', t.plain, t.label);
  if (j.dataCase) row('데이터 준비', D[j.dataCase].plain, D[j.dataCase].label);
  if (j.integration) row('데이터 연결', I[j.integration].plain, I[j.integration].label);
  row('개발 예상 기간(요건 확정 후)', leadtimeText(j.leadtime), !j.leadtime ? '산정 불가' : j.leadtime.tbd ? `상담 후 결정 (BRM 참고 초안 ${j.leadtime.min}~${j.leadtime.max}주)` : j.leadtime.items.map((it) => `${it.label} ${it.min === it.max ? it.min + '주' : it.min + '~' + it.max + '주'}${it.parallel ? '(병행)' : ''}`).join(' · ') + (() => { const c = leadtimeCalcText(j.leadtime); return c ? ' — ' + c.formula : ''; })());
  if (j.embed) row(EMBED_NOTICE.title, EMBED_NOTICE.plain, EMBED_NOTICE.badge);
  const flags = j.flags.map((f) => `<li class="notice" data-level="${f.level}" style="margin-top:6px"><span class="notice-emoji">${f.level === 'warn' ? '⚠️' : f.level === 'check' ? '🔍' : '💡'}</span><span>${esc(f.text)}</span></li>`).join('');
  const st = j.stakeholders.map((s) => esc(s.name)).join(' · ');
  return `
    <div class="jgrid">${rows.join('')}</div>
    <p class="hint mt-sm">업무 요건이나 데이터 연계에 따라 기간이 달라질 수 있어요.</p>
    <p class="text-sm mt-md"><b>협의처</b> <span class="text-sub">${st}</span></p>
    <ul class="mt-sm" style="list-style:none">${flags}</ul>
    <p class="notice" data-level="warn" style="margin-top:10px"><span class="notice-emoji">🛡️</span><span><b>꼭 확인하세요</b><br>${GOVERNANCE_NOTICES.map((n) => '– ' + n).join('<br>')}</span></p>`;
}

function renderSim() {
  const host = document.getElementById('sim');
  if (!host) return;
  const vis = visibleQuestions(sim);
  const rows = vis.map((q, i) => simQuestionRow(q, i + 1)).join('');
  const done = nextQuestion(sim) === null;
  host.innerHTML = `
    <div class="row wrap mb-md" id="presets">
      ${SIM_PRESETS.map((p, i) => `<button class="chip" data-preset="${i}">${p.name}</button>`).join('')}
      <button class="chip" data-preset="reset">↺ 초기화</button>
    </div>
    <div class="sim-grid">
      <div class="card"><h3 class="card-title">이 시나리오의 질문 순서 <span class="badge" data-tone="neutral">${vis.length}문항${done ? ' · 완료' : ''}</span></h3><div class="stack-sm">${rows}</div></div>
      <div class="card sim-judge"><h3 class="card-title">판정 결론 ${done ? '<span class="badge" data-tone="success">✅ 시나리오 완성</span>' : '<span class="badge" data-tone="neutral">진행 중</span>'}</h3>${renderJudgement(sim)}</div>
    </div>`;

  host.querySelectorAll('.ssel').forEach((el) =>
    el.addEventListener('change', () => { const t = /** @type {HTMLSelectElement} */ (el); sim = pruneAnswers({ ...sim, [String(t.dataset.qid)]: t.value }); renderSim(); }));
  host.querySelectorAll('.stxt').forEach((el) =>
    el.addEventListener('change', () => { const t = /** @type {HTMLInputElement} */ (el); sim = pruneAnswers({ ...sim, [String(t.dataset.qid)]: t.value }); renderSim(); }));
  host.querySelectorAll('[data-preset]').forEach((el) =>
    el.addEventListener('click', () => {
      const k = String(/** @type {HTMLElement} */ (el).dataset.preset);
      sim = k === 'reset' ? {} : complete(SIM_PRESETS[Number(k)].partial);
      renderSim();
    }));
}

/**
 * @param {HTMLElement} root
 * @param {{ generatedAt?: string }} [opts]  standalone 생성 시각 표기용
 */
function mountFlow(root, opts = {}) {
  const style = document.createElement('style');
  style.textContent = FLOW_CSS;
  document.head.appendChild(style);

  const gates = ['q7_kind', 'q9_data', 'q13_online'].map((id) => `Q${QNO.get(id)}`).join(' · ');
  const stamp = opts.generatedAt ? ` · 생성 ${opts.generatedAt}` : '';
  root.innerHTML = `
<div class="fwrap">
  <header class="mb-lg">
    <p class="eyebrow">AX-BRM · 상담 흐름도 <span class="num">v${QUESTIONNAIRE_VERSION}${stamp}</span></p>
    <h1 style="font-size:26px;margin-top:6px">시나리오별 질문 흐름과 판정 결론</h1>
    <p class="text-sub text-sm mt-sm">실제 질문 정의와 판정 규칙에서 <b>자동 생성</b>된 문서예요.
    흐름을 가르는 질문은 <b>${gates}</b> 세 개이고, 그 답의 조합으로 아래 <b>${SCENARIOS.length}가지 시나리오</b>가 나와요.
    🔀 분기 질문에서 <b>✓ 진한 칩</b>이 이 시나리오의 답이고, 점선 칩을 누르면 그 답의 시나리오로 이동해요.</p>
  </header>

  <nav class="ftoc" aria-label="목차">
    ${SCENARIOS.map((s) => `<a href="#sc-${s.key}">${s.emoji} 시나리오 ${s.num}</a>`).join('')}
    <a href="#sim-sec">🎛 시뮬레이터</a>
  </nav>

  ${SCENARIOS.map(renderScenario).join('')}

  <section id="sim-sec">
    <h2 class="card-title" style="font-size:18px">🎛 시나리오 시뮬레이터 — 답을 고르면 질문 순서와 결론이 바뀌어요</h2>
    <p class="hint mb-md">프리셋을 누르거나 왼쪽에서 답을 직접 골라보세요. 오른쪽에 그 시나리오의 자동 판정(요청자에게 보이는 말 + BRM 내부 용어)이 나타나요.</p>
    <div id="sim"></div>
  </section>
</div>`;
  renderSim();
}

mountFlow(document.getElementById('flow-app'), { generatedAt: '2026.09.09' });
</script>
