worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /run/nginx.pid;

events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  keepalive_timeout 65;
  # 첨부 업로드(base64 JSON) 여유분 — 서버 한도(UPLOAD_MAX_MB=20)+8MB 와 맞춤
  client_max_body_size 32m;

  server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # API 는 같은 컨테이너의 node(3000) 로 프록시 — start.sh 가 nginx 와 node 를 함께 띄운다
    location /api/ {
      proxy_pass http://127.0.0.1:3000;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 120s;
    }

    # SSO 목업 팝업은 운영 산출물에 없어야 한다 — 혹시 남아 있어도 차단
    location = /popup.html { return 404; }

    # SPA 폴백 — index.html 은 캐시하지 않는다: 새 버전을 배포해도 브라우저가 옛 index.html(옛 번들 이름)을 붙들면 화면이 안 바뀐다
    location / {
      add_header Cache-Control "no-cache, no-store, must-revalidate";
      try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|woff2?|png|svg|ico)$ {
      expires 1h;
      add_header Cache-Control "public";
    }
  }
}
